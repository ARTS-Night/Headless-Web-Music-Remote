<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HWMR</title>
<style>html,body{margin:0;background:#111;color:#eee;font:14px system-ui;height:100%;overflow:hidden}[hidden]{display:none!important}#screen{width:100%;height:100%;object-fit:contain;display:block}#bar,#go{position:fixed;left:50%;transform:translateX(-50%);display:flex;gap:8px}#bar{bottom:12px}#go{top:12px}input,button{border:0;border-radius:18px;padding:9px 13px;background:#292929;color:#fff}input{width:min(65vw,320px)}#pair{height:100%;display:grid;place-content:center;gap:10px;text-align:center}#pair input{width:220px}#pair-error{color:#ff8b8b}#text{position:fixed;opacity:0;pointer-events:none}</style>
<div id="pair"><h1>HWMR</h1><form><input autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Pairing code" aria-label="Pairing code"><button>Pair</button></form><span id="pair-error"></span></div><img id="screen" hidden alt="Remote Brave screen"><textarea id="text" aria-label="Remote text input"></textarea><form id="go" hidden><input placeholder="URL or search" aria-label="URL or search"><button>Go</button></form><div id="bar" hidden><button data-action="back">←</button><button id="tabs">▢</button><button data-key="Space">▶</button><button data-action="reload">↻</button><button data-action="forward">→</button></div>
<script>
const image=document.querySelector('#screen'),pair=document.querySelector('#pair'),error=document.querySelector('#pair-error'),text=document.querySelector('#text');let control,frames,token=localStorage.hwmrToken,composing=false,composed='';const auth=ws=>ws.send(JSON.stringify({type:'auth',token})),send=value=>control?.send(JSON.stringify(value));const expired=()=>{localStorage.removeItem('hwmrToken');token='';pair.hidden=false;image.hidden=true;document.querySelector('#go').hidden=true;document.querySelector('#bar').hidden=true;error.textContent='Session expired. Pair again.'};function start(){if(!token)return;pair.hidden=true;image.hidden=false;document.querySelector('#go').hidden=false;document.querySelector('#bar').hidden=false;control=new WebSocket(`ws://${location.host}/ws/control`);frames=new WebSocket(`ws://${location.host}/ws/frame`);frames.binaryType='blob';control.onopen=()=>auth(control);frames.onopen=()=>auth(frames);control.onclose=expired;frames.onclose=expired;control.onmessage=e=>{const r=JSON.parse(e.data);if(r.ok&&r.result?.text_input)text.focus()};frames.onmessage=e=>{const old=image.src;image.src=URL.createObjectURL(e.data);if(old)URL.revokeObjectURL(old)}}document.querySelector('#pair form').onsubmit=async e=>{e.preventDefault();const code=e.currentTarget.querySelector('input').value.trim();const r=await fetch('/pair',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code})});if(!r.ok){error.textContent='Incorrect pairing code';return}token=(await r.json()).token;localStorage.hwmrToken=token;start()};function point(e){const r=image.getBoundingClientRect();return{x:(e.clientX-r.left)*430/r.width,y:(e.clientY-r.top)*932/r.height}}image.onclick=e=>send({type:'tap',...point(e)});image.onwheel=e=>{e.preventDefault();send({type:'scroll',...point(e),delta_y:e.deltaY})};text.oncompositionstart=()=>composing=true;text.oncompositionupdate=()=>{};text.oncompositionend=e=>{composing=false;composed=e.data;send({type:'insert_text',text:e.data});text.value=''};text.oninput=e=>{if(!composing&&e.data){if(e.data!==composed)send({type:'insert_text',text:e.data});composed='';text.value=''}};text.onkeydown=e=>{if(['Backspace','Enter','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();send({type:'key',key:e.key});text.value=''}};document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>send({type:b.dataset.action}));document.querySelector('[data-key]').onclick=e=>send({type:'key',key:e.currentTarget.dataset.key});document.querySelector('#go').onsubmit=e=>{e.preventDefault();const value=e.currentTarget.querySelector('input').value.trim();if(value)send({type:'go',text:value})};document.querySelector('#tabs').onclick=async()=>{const r=await fetch('/tabs',{headers:{authorization:`Bearer ${token}`}});if(r.status===401)return expired();const tabs=await r.json(),pick=prompt(tabs.items.map((t,i)=>`${i+1}. ${t.active?'▶ ':''}${t.title||t.url}`).join('\n')),tab=tabs.items[Number(pick)-1];if(tab)send({type:'select_tab',id:tab.id})};start();
</script>
