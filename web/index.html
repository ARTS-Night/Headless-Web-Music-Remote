<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HWMR</title>
<style>
html,body{margin:0;background:#111;color:#eee;font:14px system-ui;height:100%;height:100dvh;overflow:hidden}
[hidden]{display:none!important}
#app{box-sizing:border-box;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;height:100dvh;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom))}
#viewer{min-width:0;min-height:0;overflow:hidden;background:#000;border-radius:12px;touch-action:none}
#screen{display:block;width:100%;height:100%;object-fit:fill}
#bar,#go{display:flex;gap:8px;justify-content:center}#bar{flex-wrap:wrap}
#go input{flex:1;min-width:0}
input,button{box-sizing:border-box;border:0;border-radius:18px;padding:9px 13px;background:#292929;color:#fff}input,textarea{font-size:16px}
input{width:min(65vw,320px)}
#pair{position:fixed;inset:0;display:grid;place-content:center;gap:10px;text-align:center;z-index:1}
#version{margin:-6px 0 8px;color:#888;font-size:12px}
#pair input{width:220px}#pair-error{color:#ff8b8b}
#text{position:fixed;left:50%;bottom:0;width:2px;height:2px;padding:0;border:0;opacity:.01;background:transparent;color:transparent;caret-color:transparent;font-size:16px;z-index:3}
#tab-list{position:fixed;z-index:2;left:12px;right:12px;bottom:max(72px,calc(60px + env(safe-area-inset-bottom)));max-height:50dvh;overflow:auto;padding:8px;background:#1c1c1c;border-radius:12px;box-shadow:0 8px 28px #0009}
#tab-list button{display:block;width:100%;margin:4px 0;border-radius:9px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#tab-list button.active{background:#4a6fa5}
</style>
<div id="pair"><h1>HWMR</h1><div id="version">v0.1.9-beta.4</div><form><input autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="6" placeholder="Pairing code" aria-label="Pairing code"><button>Pair</button></form><span id="pair-error"></span></div>
<main id="app" hidden>
  <form id="go"><input placeholder="URL or search" aria-label="URL or search"><button>Go</button></form>
  <div id="viewer"><img id="screen" alt="Remote Brave screen"><textarea id="text" aria-label="Remote text input" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"></textarea></div>
  <div id="bar"><button data-action="back">←</button><button id="tabs">▢</button><button data-key="Space">▶</button><button data-action="reload">↻</button><button data-action="forward">→</button><button id="keyboard" type="button" aria-label="Show keyboard">⌨</button><button id="logout" type="button">Log out</button></div>
  <section id="tab-list" hidden aria-label="Tabs"></section>
</main>
<script>
const app=document.querySelector('#app'),viewer=document.querySelector('#viewer'),image=document.querySelector('#screen'),pair=document.querySelector('#pair'),error=document.querySelector('#pair-error'),text=document.querySelector('#text'),tabList=document.querySelector('#tab-list');
let control,frames,token=localStorage.hwmrToken,composing=false,suppressInput=false,remoteEditable=false,nativeTouch=null,pendingTouchMove=null,touchMoveFrame=0,suppressClick=false,viewport='',lastTouchMoveSentAt=0;
const touchMoveInterval=1000/45;
const auth=ws=>ws.send(JSON.stringify({type:'auth',token}));
const send=value=>{if(control?.readyState===WebSocket.OPEN)control.send(JSON.stringify(value))};
const viewerSize=()=>{const r=viewer.getBoundingClientRect();return[ Math.round(r.width),Math.round(r.height) ]};
const fit=()=>{
  const [width,height]=viewerSize(),next=`${width}x${height}`;
  if(width&&height&&next!==viewport&&control?.readyState===WebSocket.OPEN){viewport=next;send({type:'resize',width,height})}
};
new ResizeObserver(fit).observe(viewer);
const showPairing=message=>{localStorage.removeItem('hwmrToken');token='';tabList.hidden=true;pair.hidden=false;app.hidden=true;error.textContent=message};
const expired=()=>showPairing('Session expired. Pair again.');
function start(){
  if(!token)return;
  pair.hidden=true;app.hidden=false;
  control=new WebSocket(`ws://${location.host}/ws/control`);
  frames=new WebSocket(`ws://${location.host}/ws/frame`);frames.binaryType='blob';
  control.onopen=()=>{auth(control);requestAnimationFrame(fit)};frames.onopen=()=>auth(frames);
  control.onclose=()=>{if(nativeTouch&&control.readyState===WebSocket.OPEN)send({type:'touch_cancel',touch_id:nativeTouch.id});nativeTouch=null;pendingTouchMove=null;expired()};frames.onclose=expired;
  control.onmessage=e=>{const r=JSON.parse(e.data);if(r.ok&&r.result?.text_input){remoteEditable=true;text.focus({preventScroll:true})}};
  frames.onmessage=e=>{const old=image.src;image.src=URL.createObjectURL(e.data);if(old)URL.revokeObjectURL(old)};
}
async function pairWith(payload){
  const r=await fetch('/pair',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
  if(!r.ok){error.textContent='Incorrect pairing code';return}
  token=(await r.json()).token;localStorage.hwmrToken=token;start();
}
document.querySelector('#pair form').onsubmit=e=>{e.preventDefault();pairWith({code:e.currentTarget.querySelector('input').value.trim()})};
function fragmentPairPayload(){
  const match=location.hash.match(/^#pair=([^&]+)$/);
  if(!match)return null;
  let payload=null;
  try{payload=JSON.parse(decodeURIComponent(match[1]))}catch{}
  history.replaceState(null,'',location.pathname+location.search);
  if(payload?.v!==1||typeof payload.nonce!=='string'||!/^[0-9a-f]{32}$/.test(payload.nonce)){
    error.textContent='The local pairing link is invalid or expired';
    return null;
  }
  return {nonce:payload.nonce};
}
function point(e){
  const r=image.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
  const width=image.naturalWidth||430,height=image.naturalHeight||932;
  return{x:Math.max(0,Math.min(width,x*width)),y:Math.max(0,Math.min(height,y*height))};
}
image.onclick=e=>{if(suppressClick||e.pointerType==='touch'){suppressClick=false;return}remoteEditable=false;send({type:'tap',...point(e)});
};
image.onwheel=e=>{e.preventDefault();send({type:'scroll',...point(e),delta_y:e.deltaY})};
const sendText=value=>{if(!value)return;send({type:'insert_text',text:value});suppressInput=true;text.value=''};
text.oncompositionstart=()=>{composing=true;suppressInput=false};
text.oncompositionend=e=>{composing=false;sendText(text.value||e.data||'')};
text.onbeforeinput=e=>{if(composing)return;if(e.inputType==='deleteContentBackward'||e.inputType==='deleteContentForward'){e.preventDefault();send({type:'key',key:e.inputType==='deleteContentBackward'?'Backspace':'Delete'});text.value='';return}if(e.inputType==='insertLineBreak'||e.inputType==='insertParagraph'){e.preventDefault();send({type:'key',key:'Enter'});text.value='';return}if((e.inputType==='insertText'||e.inputType==='insertReplacementText'||e.inputType==='insertFromPaste')&&e.data)sendText(e.data)};
text.oninput=()=>{if(composing)return;if(suppressInput){suppressInput=false;return}sendText(text.value)};
text.onkeydown=e=>{if(['Backspace','Enter','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();send({type:'key',key:e.key});text.value=''}};
document.querySelector('#keyboard').onclick=()=>{if(!remoteEditable){error.textContent='Tap a text field in the remote page first.';return}text.focus({preventScroll:true})};
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>send({type:b.dataset.action}));
document.querySelector('[data-key]').onclick=e=>send({type:'key',key:e.currentTarget.dataset.key});
document.querySelector('#logout').onclick=async()=>{
  const r=await fetch('/logout',{method:'POST',headers:{authorization:`Bearer ${token}`}});if(!r.ok)return expired();
  control.onclose=frames.onclose=null;control.close();frames.close();showPairing('Logged out. Check the HWMR window for the new pairing code.');
};
document.querySelector('#go').onsubmit=e=>{e.preventDefault();const field=e.currentTarget.querySelector('input'),value=field.value.trim();field.blur();if(value)send({type:'go',text:value})};
document.querySelector('#tabs').onclick=async()=>{
  const r=await fetch('/tabs',{headers:{authorization:`Bearer ${token}`}});if(r.status===401)return expired();
  const tabs=await r.json();tabList.replaceChildren(...tabs.items.map(t=>{const b=document.createElement('button');b.textContent=`${t.active?'● ':''}${t.title||t.url}`;b.title=t.url;b.className=t.active?'active':'';b.onclick=()=>{tabList.hidden=true;send({type:'select_tab',id:t.id})};return b}));tabList.hidden=!tabList.hidden;
};
const flushTouchMove=(force=false)=>{touchMoveFrame=0;if(!pendingTouchMove||!nativeTouch)return;const now=performance.now();if(!force&&lastTouchMoveSentAt&&now-lastTouchMoveSentAt<touchMoveInterval){touchMoveFrame=requestAnimationFrame(()=>flushTouchMove(false));return}send(pendingTouchMove);pendingTouchMove=null;lastTouchMoveSentAt=now};
const queueTouchMove=move=>{pendingTouchMove=move;if(!touchMoveFrame)touchMoveFrame=requestAnimationFrame(flushTouchMove)};
image.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='touch'||!e.isPrimary||nativeTouch)return;
  e.preventDefault();nativeTouch={id:e.pointerId};lastTouchMoveSentAt=0;suppressClick=false;
  if(image.setPointerCapture)image.setPointerCapture(e.pointerId);
  send({type:'touch_start',...point(e),touch_id:e.pointerId});
},{passive:false});
image.addEventListener('pointermove',e=>{
  if(!nativeTouch||e.pointerId!==nativeTouch.id)return;
  e.preventDefault();queueTouchMove({type:'touch_move',...point(e),touch_id:nativeTouch.id});
},{passive:false});
const finishTouch=(e,cancelled)=>{
  if(!nativeTouch||e.pointerId!==nativeTouch.id)return;
  e.preventDefault();if(touchMoveFrame)cancelAnimationFrame(touchMoveFrame);touchMoveFrame=0;flushTouchMove(true);const id=nativeTouch.id,coords=point(e);send({type:cancelled?'touch_cancel':'touch_end',...coords,touch_id:id});
  if(image.releasePointerCapture)image.releasePointerCapture(id);nativeTouch=null;pendingTouchMove=null;lastTouchMoveSentAt=0;suppressClick=true;setTimeout(()=>{suppressClick=false},500);
};
image.addEventListener('pointerup',e=>finishTouch(e,false),{passive:false});
image.addEventListener('pointercancel',e=>finishTouch(e,true),{passive:false});
window.addEventListener('pagehide',()=>{if(nativeTouch&&control?.readyState===WebSocket.OPEN)send({type:'touch_cancel',touch_id:nativeTouch.id});nativeTouch=null;pendingTouchMove=null});
const bootstrap=fragmentPairPayload();
if(bootstrap)pairWith(bootstrap);else start();
</script>
