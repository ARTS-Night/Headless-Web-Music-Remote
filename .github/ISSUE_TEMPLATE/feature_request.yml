name: Feature request
description: Suggest a focused improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like HWMR to do?
    validations:
      required: true
  - type: textarea
    id: situation
    attributes:
      label: What situation would this help with?
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What do you use today instead, or what workaround is possible?
  - type: textarea
    id: context
    attributes:
      label: Additional context
